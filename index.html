function bulk(u){const lv=L[u.id],rem=u.m-lv;if(rem<=0)return{n:0,cost:0};const disc=(G.lg=='e'?.95:1)*(G.lg=='d'&&u.t==0?.9:1)*ltK(u),a=u.b*Math.pow(u.g,lv)*disc,cn=k=>Math.ceil(u.g==1?a*k:a*(Math.pow(u.g,k)-1)/(u.g-1));let n=1;if(u.t!=3){if(CFG.qty=='10')n=Math.min(10,rem);else if(CFG.qty=='max'){for(let k=2;k<=rem;k++){if(cn(k)<=G.m)n=k;else break}}}return{n,cost:cn(n)}}
